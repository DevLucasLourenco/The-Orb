<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb — Spike 01</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --fg:#d6dde6; --dim:#8b95a3; --accent:#6aa9ff; --ok:#56d364; --warn:#e3b341; --err:#f85149; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 40px 1fr; height: 100%; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header b { color: var(--accent); }
  .pill { padding: 2px 8px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); color: var(--dim); }
  .pill.ok { color: var(--ok); } .pill.err { color: var(--err); }
  #term { padding: 6px; overflow: hidden; }
  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { margin: 0; padding: 8px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); border-bottom: 1px solid var(--line); }
  #tree { padding: 8px 12px; border-bottom: 1px solid var(--line); min-height: 90px; }
  #events { flex: 1; overflow: auto; padding: 4px 0; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .ev { padding: 3px 12px; border-bottom: 1px solid #1d232c; word-break: break-word; }
  .ev .t { color: var(--dim); } .ev .type { color: var(--accent); }
  .ev.intrusive .type { color: var(--warn); } .ev.fail .type { color: var(--err); } .ev.done .type { color: var(--ok); }
  .node { margin-left: 14px; } .state { color: var(--ok); }
  select, button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <b>ORB</b> spike 01
    <select id="cmd"></select>
    <input id="model" placeholder="modelo (auto)" size="14" style="background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 6px">
    <button id="open">Abrir terminal</button>
    <span id="cwd" class="pill"></span>
    <span id="status" class="pill">desconectado</span>
    <span id="lat" class="pill">latência —</span>
  </header>
  <div id="term"></div>
  <aside>
    <h2>Alter Egos (telemetria nível 0)</h2>
    <div id="tree">sem dados ainda</div>
    <h2>Eventos do protocolo</h2>
    <div id="events"></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
const token = new URLSearchParams(location.search).get("token") || "";
const $ = (id) => document.getElementById(id);
const term = new Terminal({ fontFamily: "Consolas, monospace", fontSize: 14, cursorBlink: true, scrollback: 5000, theme: { background: "#0e1116" } });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open($("term"));
fit.fit();

let ws = null;
const agents = new Map();

function setStatus(text, cls) { const s = $("status"); s.textContent = text; s.className = "pill " + (cls || ""); }

function renderTree() {
  if (!agents.size) { $("tree").textContent = "sem dados ainda"; return; }
  $("tree").innerHTML = [...agents.entries()].map(([name, a]) =>
    `<div class="${name === "main" ? "" : "node"}">● <b>${name}</b> <span class="state">${a.state}</span> <span class="pill">${a.events} ev</span><div style="color:var(--dim)">${a.last}</div></div>`
  ).join("");
}

const STATE_BY_CATEGORY = { read: "READING", write: "CODING", execute: "EXECUTING", test: "TESTING", research: "RESEARCHING", review: "REVIEWING", delegate: "DELEGATING", other: "WORKING" };

function onEvent(ev, receivedAt) {
  const name = ev.alter_ego || "main";
  const a = agents.get(name) || { state: "IDLE", events: 0, last: "" };
  a.events++;
  if (ev.type === "tool.started") { a.state = STATE_BY_CATEGORY[ev.payload.category] || "WORKING"; a.last = `${ev.payload.tool} ${ev.payload.target || ""}`; }
  else if (ev.type === "tool.completed" || ev.type === "tool.failed") { a.state = "THINKING"; }
  else if (ev.type === "intrusive_thought") { a.state = "THINKING"; a.last = "↳ " + ev.payload.text; }
  else if (ev.type === "agent.message") { a.last = ev.payload.text; }
  agents.set(name, a);
  renderTree();

  if (ev.timestamp) {
    const ms = Math.max(0, Math.round(receivedAt * 1000 - Date.parse(ev.timestamp)));
    $("lat").textContent = `latência ~${ms} ms`;
  }
  const cls = ev.type === "intrusive_thought" ? "intrusive" : ev.type.endsWith("failed") ? "fail" : ev.type.endsWith("completed") ? "done" : "";
  const div = document.createElement("div");
  div.className = "ev " + cls;
  const detail = ev.payload.tool ? `${ev.payload.tool} ${ev.payload.target || ""}` : (ev.payload.text || "");
  div.innerHTML = `<span class="t">${(ev.timestamp || "").slice(11, 19)}</span> <span class="type">${ev.type}</span> <b>${name}</b> ${detail.replace(/</g, "&lt;")}`;
  const box = $("events");
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  box.appendChild(div);
  if (stick) box.scrollTop = box.scrollHeight;
}

function connect() {
  if (ws) ws.close();
  term.reset(); agents.clear(); renderTree(); $("events").innerHTML = "";
  ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}&provider=${$("cmd").value}&model=${encodeURIComponent($("model").value)}`);
  ws.onopen = () => { setStatus("conectado", "ok"); fit.fit(); ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows })); term.focus(); };
  ws.onclose = () => setStatus("desconectado", "err");
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.channel === "term") term.write(msg.data);
    else if (msg.channel === "event") onEvent(msg.event, msg.t);
    else if (msg.channel === "exit") setStatus("processo terminou (" + msg.code + ")", "err");
    else if (msg.channel === "system") setStatus(msg.error || msg.info, msg.error ? "err" : "ok");
  };
}

term.onData((data) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "input", data })); });
window.addEventListener("resize", () => { fit.fit(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows })); });
$("open").onclick = connect;

fetch("/config").then(r => r.json()).then(c => {
  $("cwd").textContent = c.cwd;
  const opts = ["auto", "shell", ...Object.keys(c.providers)];
  $("cmd").innerHTML = opts.map(x => `<option value="${x}">${x in c.providers && !c.providers[x] ? x + " (não instalado)" : x}</option>`).join("");
  $("cmd").value = "claude";
});
</script>
</body>
</html>
