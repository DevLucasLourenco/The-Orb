[project]
name = "the-orb"
version = "0.1.0"
description = "The Orb: um mundo 3D onde cada projeto é um prédio e cada sessão de IA é um personagem, com telemetria real."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
the-orb = "orb.gateway.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
